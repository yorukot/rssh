[package]
name = "rssh"
version = "0.1.0"
edition = "2024"
description = "Session-scoped SSH wrapper with SFTP file upload for macOS/Ghostty"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "rssh"
path = "src/main.rs"

[lib]
name = "rssh"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.44", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.30", features = ["term", "signal", "process", "fs", "poll", "user"] }
tempfile = "3.19"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
openssh-sftp-client = "0.15"
arboard = "3.7"
png = "0.17"

[dev-dependencies]
proptest = "1.6"
